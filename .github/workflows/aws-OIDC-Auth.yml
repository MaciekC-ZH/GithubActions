name: AWS OIDC Auth
on: 
  workflow_dispatch: 
permissions: 
  id-token: write
  contents: read
env:
  AWS_REGION: "eu-central-1"
  ROLE_ARN: "arn:aws:iam::123456789012:role/my-github-oidc-role"
jobs:
  aws-connect:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie repo
        uses: actions/checkout@v4
      - name: Logowanie AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Weryfikcja
        run: aws sts get-caller-identity
