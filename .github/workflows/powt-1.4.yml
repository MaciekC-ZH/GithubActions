name: Docker CI/CD
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
  IMAGE_NAME: "twoj-user/moja-aplikacja"
jobs:
  docker-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie repo
        uses: actions/checkout@v4
      - name: Logowanie warunkowe
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest #doda tag w stylu nazwa-aplikacji:latest <jako ostatnia wersja
            ${{ env.IMAGE_NAME }}:${{ github.sha }} #doda nazwa_aplikacji:hash_commita <dla lepszego śledzenia
