name: Terraform GitOps
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
env:
  AWS_REGION: "eu-central-1"

jobs:
  tf-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie repo
        uses: actions/checkout@v4
      - name: Konfiguracja narzędzia
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"
      - name: Weryfikacja formatu
        run: terraform fmt -check
      - name: Inicjalizacja
        run: terraform init
      - name: Planowanie
        run: terraform plan

  tf-apply:
    runs-on: ubuntu-latest
    needs: tf-plan
    if: github.event_name == 'push'
    environment: production
    steps:
      - name: Pobranie repo
        uses: actions/checkout@v4
      - name: Konfig narzędzia
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"
      - name: Inicjalizacja
        run: terraform init
      - name: Aplikacja zmian
        run: terraform apply -auto-approve
