name: Zadanie z Dockerem
on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie repo
        uses: actions/checkout@v4

      - name: Komunikat
        run: |
          echo "Testy jednostkowe zaliczone"
  build-docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Pobranie repo
        uses: actions/checkout@v4
      - name: Logowanie
        uses: docker/login-action@v3
        # with:
        #   username: ${{ secrets.DOCKER_USERNAME }}
        #   password: ${{ secrets.DOCKER_TOKEN }}
      - name: Budowanie obrazu
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: moj-user/moja-app:v1.0
