name: Tet Custom Action
on:
  workflow_dispatch:
jobs:
  run-test:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie repo
        uses: actions/checkout@v4
      - name: Wywolanie akcji kompozytowej
        uses: ./.github/actions/powt-1.5-action
        with:
          python-version: "3.10"
