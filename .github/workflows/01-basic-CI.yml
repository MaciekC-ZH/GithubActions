name: Web App CI
on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repo
        uses: actions/checkout@v4

      - name: Komunikat
        run: |
          echo "Uruchamian testy jednostkowe ..."
          exit 0
  build:
    runs-on: ubuntu-latest
    needs: test
    env:
      APP_VERSION: "1.0.0"
    steps:
      - name: Pobiera repo
        uses: actions/checkout@v4

      - name: Numer wersji
        run: |
          echo "Budowanie wersji: $APP_VERSION"
          echo "Logowanie z uzyciem tokenu: ${{ secrets.REGISTRY_TOKEN }}"

